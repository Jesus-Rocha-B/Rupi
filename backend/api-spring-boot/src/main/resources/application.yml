spring:
  application:
    name: rupi-api
  datasource:
    url: ${RUPI_DB_URL:jdbc:mysql://localhost:3306/rupi?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${RUPI_DB_USERNAME:rupi}
    password: ${RUPI_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  sql:
    init:
      mode: never

server:
  port: ${PORT:8081}
  error:
    include-message: never
  servlet:
    encoding:
      charset: UTF-8
      force: true
      force-response: true
      enabled: true

rupi:
  auth:
    demo-session-token: ${RUPI_DEMO_SESSION_TOKEN:}


  ai:
    endpoint: ${RUPI_AI_ENDPOINT:}
    key: ${RUPI_AI_KEY:}
    provider: ${RUPI_AI_PROVIDER:}
    model: ${RUPI_AI_MODEL:}
