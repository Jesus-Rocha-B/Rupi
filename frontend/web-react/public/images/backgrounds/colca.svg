<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <linearGradient id="colca-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bce0f5"/>
      <stop offset="40%" stop-color="#e3f2fd"/>
      <stop offset="85%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f8ede1"/>
    </linearGradient>
    <linearGradient id="colca-volcano" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60748a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8fa3b8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="colca-canyon-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7d432b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a45f42" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="colca-canyon-right" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#68341f" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#934d31" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1800" fill="url(#colca-sky)"/>

  <!-- Sol brillante sobre el cañón -->
  <circle cx="340" cy="180" r="130" fill="#ffd56b" opacity="0.7"/>

  <!-- Silueta del Volcán Misti / Sabancaya al fondo con fumarola sutil -->
  <polygon points="680,240 500,460 860,460" fill="url(#colca-volcano)"/>
  <!-- Nieve en cumbre del volcán -->
  <polygon points="680,240 645,285 715,285" fill="#ffffff" opacity="0.8"/>

  <!-- Paredes Profundas del Cañón del Colca (Abismo V) -->
  <path d="M-50 420 L420 890 L380 1800 L-50 1800 Z" fill="url(#colca-canyon-left)"/>
  <path d="M1250 380 L620 920 L660 1800 L1250 1800 Z" fill="url(#colca-canyon-right)"/>

  <!-- Río Colca al Fondo del Abismo -->
  <path d="M420 890 Q520 1020 480 1250 Q560 1480 510 1800 L560 1800 Q610 1480 530 1250 Q580 1020 620 920 Z" fill="#2d6f8a" opacity="0.5"/>

  <!-- Andenes y Terrazas Agrícolas Collaguas y Cabanas en las laderas -->
  <g fill="none" stroke="#758a53" stroke-width="5" opacity="0.45">
    <path d="M-20 640 Q150 720 300 810"/>
    <path d="M-20 740 Q160 820 320 910"/>
    <path d="M-20 850 Q180 940 340 1030"/>
    <path d="M-20 970 Q200 1060 360 1160"/>

    <path d="M1220 580 Q1050 680 850 780"/>
    <path d="M1220 690 Q1030 790 820 900"/>
    <path d="M1220 810 Q1010 910 790 1020"/>
  </g>

  <!-- Cóndor Andino Soberano Volando (Cruz del Cóndor) -->
  <g transform="translate(620, 480)">
    <!-- Alas extendidas del Cóndor -->
    <path d="M0 0 C-60 -40, -160 -40, -220 -15 C-190 5, -140 -5, -60 10 C-30 15, -10 25, 0 35 C10 25, 30 15, 60 10 C140 -5, 190 5, 220 -15 C160 -40, 60 -40, 0 0 Z" fill="#212529" opacity="0.85"/>
    <!-- Plumas blancas del cuello / collarín característico -->
    <ellipse cx="0" cy="5" rx="14" ry="7" fill="#ffffff" opacity="0.95"/>
    <!-- Cabeza rojiza del cóndor -->
    <circle cx="0" cy="-6" r="6" fill="#b93b2a"/>
    <!-- Cola en abanico -->
    <polygon points="-25,30 25,30 0,55" fill="#212529" opacity="0.85"/>
  </g>

  <!-- Cactus San Pedro y flora de alta montaña en primer plano -->
  <g stroke="#39593f" stroke-width="7" stroke-linecap="round" opacity="0.45">
    <line x1="80" y1="1800" x2="80" y2="1620"/>
    <line x1="80" y1="1690" x2="110" y2="1690"/>
    <line x1="110" y1="1690" x2="110" y2="1640"/>

    <line x1="1120" y1="1800" x2="1120" y2="1640"/>
    <line x1="1120" y1="1710" x2="1090" y2="1710"/>
    <line x1="1090" y1="1710" x2="1090" y2="1660"/>
  </g>
</svg>