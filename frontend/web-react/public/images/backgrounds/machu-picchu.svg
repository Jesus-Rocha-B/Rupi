<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <linearGradient id="mp-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8ebdf"/>
      <stop offset="35%" stop-color="#edf6ef"/>
      <stop offset="70%" stop-color="#f7fbf8"/>
      <stop offset="100%" stop-color="#fdfbf5"/>
    </linearGradient>
    <linearGradient id="mp-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe699" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd26a" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="mp-backmount" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#557f6d" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7ea894" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="mp-huayna" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a5a43" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#366b52" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4a856a" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="mp-terrace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#54805f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3f664a" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="mp-stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#697a70" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#829489" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="mp-mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Cielo Andino -->
  <rect width="1200" height="1800" fill="url(#mp-sky)"/>

  <!-- Sol Andino Suave -->
  <circle cx="850" cy="240" r="160" fill="url(#mp-sun)"/>
  <circle cx="850" cy="240" r="230" fill="url(#mp-sun)" opacity="0.4"/>

  <!-- Nubes Andinas Flotantes -->
  <path d="M120 180 q60 -40 130 -10 q70 -50 140 -5 q60 -20 110 30 q-20 40 -60 40 h-280 z" fill="#ffffff" opacity="0.55"/>
  <path d="M720 140 q45 -30 95 -8 q55 -38 110 -4 q45 -15 85 22 q-15 30 -45 30 h-220 z" fill="#ffffff" opacity="0.45"/>

  <!-- Montañas Lejanas del Valle Sagrado -->
  <path d="M-50 480 L180 280 L390 440 L650 240 L880 430 L1100 290 L1250 420 L1250 850 L-50 850 Z" fill="url(#mp-backmount)"/>

  <!-- Silueta Icónica de Huayna Picchu -->
  <path d="M380 620 L580 310 Q610 280 640 315 L780 490 L900 450 L1040 680 L220 680 Z" fill="url(#mp-huayna)"/>

  <!-- Franja de Niebla Mística de Selva Alta -->
  <ellipse cx="600" cy="620" rx="650" ry="85" fill="url(#mp-mist)"/>

  <!-- Terrazas y Andenes Agrícolas Incas (Sector Superior) -->
  <g fill="none" stroke="#486e56" stroke-width="6" opacity="0.45">
    <path d="M150 720 Q400 700 650 725 Q900 750 1150 710"/>
    <path d="M100 780 Q420 760 700 790 Q950 810 1180 770"/>
    <path d="M80 840 Q450 820 720 855 Q1000 870 1200 830"/>
  </g>
  <path d="M-50 720 L1250 720 L1250 1020 L-50 1020 Z" fill="url(#mp-terrace)" opacity="0.25"/>

  <!-- Muros y Recintos de Piedra Incaica (Lado Izquierdo) -->
  <g transform="translate(60, 940)" opacity="0.6">
    <rect x="0" y="0" width="140" height="90" rx="8" fill="url(#mp-stone)" stroke="#45534b" stroke-width="2"/>
    <polygon points="0,0 70,-45 140,0" fill="#7a8d81" opacity="0.7"/>
    <rect x="40" y="30" width="30" height="60" rx="3" fill="#303b35"/>
    <rect x="90" y="30" width="20" height="30" rx="3" fill="#303b35"/>
  </g>

  <!-- Terrazas y Andenes Medios -->
  <g fill="none" stroke="#3d6349" stroke-width="7" opacity="0.4">
    <path d="M50 1100 Q400 1070 750 1110 T1220 1090"/>
    <path d="M20 1180 Q380 1150 780 1195 T1250 1170"/>
    <path d="M40 1260 Q420 1230 820 1280 T1230 1250"/>
    <path d="M10 1340 Q450 1310 850 1360 T1240 1330"/>
  </g>

  <!-- Muros y Recintos de Piedra (Lado Derecho) -->
  <g transform="translate(980, 1220)" opacity="0.55">
    <rect x="0" y="0" width="160" height="110" rx="10" fill="url(#mp-stone)" stroke="#45534b" stroke-width="2"/>
    <polygon points="0,0 80,-55 160,0" fill="#7a8d81" opacity="0.7"/>
    <rect x="45" y="40" width="35" height="70" rx="4" fill="#303b35"/>
  </g>

  <!-- Andenes Inferiores de Descanso Visual -->
  <g fill="none" stroke="#365840" stroke-width="6" opacity="0.35">
    <path d="M0 1480 Q500 1450 1200 1480"/>
    <path d="M0 1590 Q500 1560 1200 1600"/>
    <path d="M0 1700 Q500 1670 1200 1710"/>
  </g>

  <!-- Siluetas sutiles de orquídeas y vegetación andina en esquinas -->
  <path d="M-20 1820 Q60 1680 80 1600 Q100 1680 160 1820 Z" fill="#294d37" opacity="0.3"/>
  <path d="M1050 1820 Q1120 1660 1150 1580 Q1180 1670 1230 1820 Z" fill="#294d37" opacity="0.3"/>
</svg>